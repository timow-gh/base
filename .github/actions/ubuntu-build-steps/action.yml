name: 'Ubuntu CMake Workflow'
description: 'Run a CMake workflow preset for Ubuntu builds'
inputs:
  cmake_workflow:
    description: 'The cmake workflow to use.'
    required: true
  install_tools:
    description: 'Additional tools to install (space-separated list: lcov, clang-tidy, cppcheck)'
    required: false
    default: ''
  build_native_args:
    description: 'Additional native build-tool arguments passed after cmake --build --'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install build tools
      run: |
        # The runner's Google Chrome repository can occasionally be mid-sync.
        # Retry with fresh indexes rather than failing the entire build.
        for attempt in 1 2 3; do
          if sudo apt-get update; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            exit 1
          fi
          sudo rm -rf /var/lib/apt/lists/*
          sleep 10
        done
        # gcc-14/g++-14 and clang-20: compilers used by the presets.
        # libclang-rt-20-dev: clang sanitizer runtime (ASan/TSan/UBSan)
        # ninja-build: fast build backend used by the CMake presets
        sudo apt-get install -y gcc-14 g++-14 clang-20 libclang-rt-20-dev ninja-build ${{ inputs.install_tools }}
      shell: bash

    - name: Extract preset names
      id: preset
      run: |
        WORKFLOW_NAME="${{ inputs.cmake_workflow }}"
        # Extract compiler and build type from workflow name
        # workflow-test-gcc-release -> conf-gcc-release
        # workflow-test-gcc-debug-asan -> conf-gcc-debug-asan
        BASE_NAME="${WORKFLOW_NAME#workflow-test-}"
        echo "configure=conf-${BASE_NAME}" >> $GITHUB_OUTPUT
        echo "build=build-${BASE_NAME}" >> $GITHUB_OUTPUT
        echo "test=test-${BASE_NAME}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Configure
      run: |
        # CPM clones GoogleTest while configuring. GitHub occasionally returns transient
        # 5xx/connection errors, so retry the complete configure step with backoff.
        for attempt in 1 2 3 4 5; do
          if cmake --preset ${{ steps.preset.outputs.configure }}; then
            break
          fi
          if [ "$attempt" = 5 ]; then
            exit 1
          fi
          sleep "$((attempt * 30))"
        done
      shell: bash

    - name: Build
      run: |
        if [ -n "${{ inputs.build_native_args }}" ]; then
          cmake --build --preset ${{ steps.preset.outputs.build }} -- ${{ inputs.build_native_args }}
        else
          cmake --build --preset ${{ steps.preset.outputs.build }}
        fi
      shell: bash

    - name: Test
      run: |
        ctest --preset ${{ steps.preset.outputs.test }}
      shell: bash
