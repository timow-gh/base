name: Ubuntu Build

on:
  push:
    branches: [main, 'develop-**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        compiler: [gcc, clang]
        build_type: [debug, release]
        delivery_mode: [shared]
        include:
          # Test the standalone delivery mode only in release builds to minimize CI time
          - compiler: gcc
            build_type: release
            delivery_mode: standalone
        exclude:
          # For develop-* branches, run only gcc+debug+shared
          - compiler: ${{ startsWith(github.ref, 'refs/heads/develop-') && 'clang' || '_no_match_' }}
          - build_type: ${{ startsWith(github.ref, 'refs/heads/develop-') && 'release' || '_no_match_' }}
    name: Build - ${{ matrix.compiler }} - ${{ matrix.build_type }} - ${{ matrix.delivery_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu-build-steps
        with:
          cmake_workflow: workflow-test-${{ matrix.compiler }}-${{ matrix.build_type }}${{ matrix.delivery_mode == 'standalone' && '-standalone' || '' }}
  
  ubuntu-build-summary:
    runs-on: ubuntu-latest
    needs: ubuntu-build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.ubuntu-build.result }}" != "success" ]; then
            echo "Ubuntu build failed"
            exit 1
          fi
          echo "All Ubuntu builds passed"