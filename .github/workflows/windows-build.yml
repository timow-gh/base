name: Windows Build

on:
  push:
    branches: [main, 'develop-**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        build_type: [debug, release]
        exclude:
          # For develop-* branches, run only msvc+debug
          - build_type: ${{ startsWith(github.ref, 'refs/heads/develop-') && 'release' || '_no_match_' }}
    name: Build - msvc - ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure
        run: |
          # CPM clones GoogleTest while configuring. GitHub occasionally returns
          # transient errors, so retry the configure step with backoff.
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            cmake --preset conf-msvc-${{ matrix.build_type }}
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { exit 1 }
            Start-Sleep -Seconds ($attempt * 30)
          }
        shell: pwsh

      - name: Build
        run: |
          cmake --build --preset build-msvc-${{ matrix.build_type }}
        shell: pwsh

      - name: Test
        run: |
          ctest --preset test-msvc-${{ matrix.build_type }}
        shell: pwsh

  windows-build-summary:
    runs-on: ubuntu-latest
    needs: windows-build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.windows-build.result }}" != "success" ]; then
            echo "Windows build failed"
            exit 1
          fi
          echo "All Windows builds passed"
