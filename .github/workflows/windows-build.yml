name: Windows Build

on:
  push:
    branches: [main, 'develop-**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        build_type: [debug, release]
        delivery_mode: [shared]
        include:
          # Test the standalone delivery mode only in release builds to minimize CI time
          - build_type: release
            delivery_mode: standalone
        exclude:
          # For develop-* branches, run only msvc+debug+shared
          - build_type: ${{ startsWith(github.ref, 'refs/heads/develop-') && 'release' || '_no_match_' }}
    name: Build - msvc - ${{ matrix.build_type }} - ${{ matrix.delivery_mode }}
    env:
      PRESET_SUFFIX: ${{ matrix.build_type }}${{ matrix.delivery_mode == 'standalone' && '-standalone' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Configure
        run: |
          # vcpkg may download source archives while configuring. GitHub occasionally
          # returns transient errors, so retry the configure step with backoff.
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            cmake --preset conf-msvc-$env:PRESET_SUFFIX
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { exit 1 }
            Start-Sleep -Seconds ($attempt * 30)
          }
        shell: pwsh
      
      - name: Build
        run: |
          cmake --build --preset build-msvc-$env:PRESET_SUFFIX
        shell: pwsh
      
      - name: Test
        run: |
          ctest --preset test-msvc-$env:PRESET_SUFFIX
        shell: pwsh
  
  windows-build-summary:
    runs-on: ubuntu-latest
    needs: windows-build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.windows-build.result }}" != "success" ]; then
            echo "Windows build failed"
            exit 1
          fi
          echo "All Windows builds passed"
