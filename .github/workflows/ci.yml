name: CI

# The checks run on pull requests only: main accepts changes only through pull
# requests, and main.yml builds the release configurations after the merge.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Draft and docs-only pull requests skip the builds. A skipped job counts as passed
  # for required status checks, a workflow skipped by paths-ignore would leave them
  # pending forever.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**.md'
              - '!License'
              - '!cliff.toml'
              - '!benchmark/**'
              - '!tools/git-hooks/**'

  # The coverage build is a gcc debug build that runs all tests, so it is the gcc check too.
  gcc:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ubuntu-build-steps
        with:
          cmake_workflow: workflow-test-gcc-coverage
          install_tools: lcov

      - name: Generate coverage report
        run: |
          cmake --build --preset build-gcc-coverage-report
        shell: bash

      - name: Extract coverage metrics
        id: coverage
        run: |
          SUMMARY=$(lcov --summary out/build/conf-gcc-coverage/coverage_filtered.info 2>&1)
          LINE_COV=$(echo "$SUMMARY" | grep -oP 'lines......: \K[0-9.]+(?=%)' || echo "0")
          BRANCH_COV=$(echo "$SUMMARY" | grep -oP 'branches...: \K[0-9.]+(?=%)' || echo "0")

          echo "line=$LINE_COV" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_COV" >> $GITHUB_OUTPUT

          # Determine status (Low < 70% < Fair < 80% < Good)
          if (( $(echo "$LINE_COV < 70" | bc -l) )); then
            echo "status=Low" >> $GITHUB_OUTPUT
          elif (( $(echo "$LINE_COV >= 80" | bc -l) )); then
            echo "status=Good" >> $GITHUB_OUTPUT
          else
            echo "status=Fair" >> $GITHUB_OUTPUT
          fi
        shell: bash
        continue-on-error: true

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.coverage.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Lines:** ${{ steps.coverage.outputs.line }}%" >> $GITHUB_STEP_SUMMARY
          echo "**Branches:** ${{ steps.coverage.outputs.branch }}%" >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ## Coverage Report (${{ steps.coverage.outputs.status }})

            | Metric | Coverage |
            |--------|----------|
            | **Lines** | ${{ steps.coverage.outputs.line }}% |
            | **Branches** | ${{ steps.coverage.outputs.branch }}% |

            [Download detailed HTML report from workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            _This check is informational and won't block the PR._

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: out/build/conf-gcc-coverage/coverage_html/
          retention-days: 30

  # ASan and UBSan combine in one build; clang-tidy runs here and nowhere else.
  clang:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu-build-steps
        with:
          cmake_workflow: workflow-test-clang-debug-asan-ubsan
          static_analysis: true
          # Ninja -k 0 keeps building independent targets after failures, so
          # clang-tidy reports as many compile and analysis issues as possible.
          build_native_args: "-k 0"

  # TSan cannot be combined with ASan. Several tests start threads.
  clang-tsan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu-build-steps
        with:
          cmake_workflow: workflow-test-clang-debug-tsan

  msvc:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-build-steps
        with:
          cmake_workflow: workflow-test-msvc-debug
